name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f src/open-webui/backend/requirements.txt ]; then
            grep -v '^torch==' src/open-webui/backend/requirements.txt > /tmp/backend-requirements-no-torch.txt
            pip install --index-url https://download.pytorch.org/whl/cpu torch
            pip install -r /tmp/backend-requirements-no-torch.txt
          fi
          pip install -e src/vietlegal_rag
          pip install pytest pytest-asyncio anyio httpx ruff

      - name: Create backward-compatible paths for tests
        run: |
          mkdir -p src/backend
          ln -s ../vietlegal_rag src/backend/app
          ln -s ../vietlegal_rag/services src/backend/services

      - name: Block tracked env files
        run: |
          tracked_env="$(git ls-files '*.env' '.env.*' ':!:*.env.example' ':!:**/*.env.example')"
          if [ -n "$tracked_env" ]; then
            echo "Tracked non-example env files are not allowed:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Run Ruff
        run: |
          ruff check src/vietlegal_rag src/infra/scripts tests

      - name: Run Pytest
        run: |
          python -m pytest tests

name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy changed app services to Droplet
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy changed services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/VietLegalGraphRAG"
            ENV_FILE="/opt/vietlegal/env/production.env"
            COMPOSE_FILE="src/infra/docker-compose.production.yml"

            cd "$APP_DIR"

            git fetch origin main
            git checkout main || git checkout -b main
            git pull origin main

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing env file: $ENV_FILE"
              exit 1
            fi

            docker network inspect vietlegal_net >/dev/null 2>&1 || docker network create vietlegal_net

            echo "Building backend"
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" build backend
            echo "Starting backend"
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --no-deps backend

            echo "Building frontend"
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" build frontend
            echo "Starting frontend"
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --no-deps frontend

            docker image prune -f


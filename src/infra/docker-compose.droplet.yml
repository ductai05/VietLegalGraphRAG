# =============================================================================
# VietLegalGraphRAG — DigitalOcean Droplet CSDL (graph_db Only)
# =============================================================================
# This compose file runs ONLY the Neo4j Graph Database (graph_db) with TLS.
# Optimized for a 4GB RAM Droplet (1GB Heap, 1.5GB Page Cache).
#
# Ports exposed:
#   - 7687 (Bolt over TLS, REQUIRED)
#   - 7473 (HTTPS Browser console)
# =============================================================================

version: '3.8'

services:
  graph_db:
    image: neo4j:5-community
    container_name: neo4j-legal
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      # RAM settings optimized for 4GB Droplet
      - NEO4J_server_memory_heap_initial__size=1024m
      - NEO4J_server_memory_heap_max__size=1024m
      - NEO4J_server_memory_pagecache_size=1500m
      # Connection TLS configurations
      - NEO4J_server_bolt_enabled=true
      - NEO4J_server_bolt_tls__level=REQUIRED
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_https_enabled=true
      - NEO4J_server_https_listen__address=0.0.0.0:7473
      - NEO4J_server_http_enabled=false
      # SSL Policies (Self-signed certificates mounted from host volume)
      - NEO4J_dbms_ssl_policy_bolt_enabled=true
      - NEO4J_dbms_ssl_policy_bolt_base__directory=/certificates/bolt
      - NEO4J_dbms_ssl_policy_bolt_private__key=private.key
      - NEO4J_dbms_ssl_policy_bolt_public__certificate=public.crt
      - NEO4J_dbms_ssl_policy_bolt_client__auth=NONE
      - NEO4J_dbms_ssl_policy_https_enabled=true
      - NEO4J_dbms_ssl_policy_https_base__directory=/certificates/https
      - NEO4J_dbms_ssl_policy_https_private__key=private.key
      - NEO4J_dbms_ssl_policy_https_public__certificate=public.crt
      - NEO4J_dbms_ssl_policy_https_client__auth=NONE
    ports:
      - "7687:7687"
      - "7473:7473"
    volumes:
      - neo4j_prod_data:/data
      - ./certs:/certificates
      - /tmp/neo4j_imports:/import
    restart: always

volumes:
  neo4j_prod_data:

# VietLegalGraphRAG production app stack.
#
# This compose file manages the Open WebUI container.
# Neo4j is provisioned separately by setup_neo4j_droplet.sh and attached to
# the same external Docker bridge network: vietlegal_net.

name: vietlegal-app

services:
  open-webui:
    container_name: vietlegal-webui
    build:
      context: ../..
      dockerfile: src/infra/Dockerfile.openwebui
    environment:
      # Open WebUI admin auto-provisioning
      - WEBUI_ADMIN_EMAIL
      - WEBUI_ADMIN_PASSWORD
      - WEBUI_SECRET_KEY
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=pending
      # Open WebUI Direct LLM Connection (for plain chat)
      - OPENAI_API_BASE_URL=${LLM_BASE_URL}
      - OPENAI_API_KEY=${LLM_API_KEY}
      # RAG service credentials / config passed to Pipe Valves
      - BACKEND_PORT=8000
      - ELASTICSEARCH_URL
      - ELASTICSEARCH_API_KEY
      - ELASTICSEARCH_INDEX
      - ELASTICSEARCH_ALIAS
      - EMBEDDING_PROVIDER
      - EMBEDDING_MODEL
      - EMBEDDING_DEVICE
      - EMBEDDING_CACHE_DIR
      - EMBEDDING_MAX_LENGTH
      - EMBEDDING_DIMS
      - EMBEDDING_ONNX_MODEL_PATH
      - EMBEDDING_ONNX_TOKENIZER_PATH
      - HF_HUB_DISABLE_SYMLINKS_WARNING
      - DENSE_NUM_CANDIDATES_FACTOR
      - DENSE_MIN_NUM_CANDIDATES
      - NEO4J_URI=${NEO4J_URI:-bolt://vietlegal-neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/credentials/google-service-account.json}
      - GOOGLE_SERVICE_ACCOUNT_PROJECT_ID
      - GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY_ID
      - GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
      - GOOGLE_SERVICE_ACCOUNT_CLIENT_EMAIL
      - GOOGLE_SERVICE_ACCOUNT_CLIENT_ID
      - OCR_PROVIDER
      - OCR_MAX_FILE_MB
      - OCR_MAX_PDF_PAGES
      - OCR_ALLOWED_MIME_TYPES
      - OCR_LANGUAGE_HINTS
      - RERANK_PROVIDER
      - RERANK_MODEL
      - VOYAGE_API_KEY
      - JINA_API_KEY
      - LLM_PROVIDER
      - LLM_BASE_URL
      - LLM_API_KEY
      - LLM_MODEL
      - LLM_MAX_TOKENS
      - ELASTICSEARCH_VERIFY_CERTS
      - ELASTICSEARCH_REQUEST_TIMEOUT
      - RERANK_MODEL_ALLOWLIST
      - RUNTIME_FALLBACK_ENABLED
      - AGENT_ENABLED
      - AGENT_MAX_ITERATIONS
      - AGENT_MAX_REQUEST_TOKENS
      - WEB_SEARCH_PROVIDER
      - WEB_SEARCH_DOMAINS
      - EXA_API_KEY
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    volumes:
      - webui-data:/app/backend/data
      - /opt/vietlegal/credentials:/app/credentials:ro
      - /opt/vietlegal/hf-cache:/app/.cache/huggingface
      - /opt/vietlegal/onnx_model:/app/onnx_model:ro
    networks:
      - vietlegal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  webui-data:

networks:
  vietlegal_net:
    external: true
    name: vietlegal_net

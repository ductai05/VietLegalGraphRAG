# VietLegalGraphRAG production app stack.
#
# This compose file manages only the application containers:
#   - backend: FastAPI API
#   - frontend: nginx static site
#
# Neo4j is provisioned separately by setup_neo4j_droplet.sh and attached to
# the same external Docker bridge network: vietlegal_net.

name: vietlegal-app

services:
  backend:
    container_name: vietlegal-backend
    build:
      context: ../..
      dockerfile: src/backend/Dockerfile
    environment:
      - BACKEND_PORT=8000
      - ELASTICSEARCH_URL
      - ELASTICSEARCH_API_KEY
      - ELASTICSEARCH_INDEX
      - ELASTICSEARCH_ALIAS
      - NEO4J_URI=${NEO4J_URI:-bolt://vietlegal-neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/credentials/google-service-account.json}
      - GOOGLE_SERVICE_ACCOUNT_PROJECT_ID
      - GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY_ID
      - GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
      - GOOGLE_SERVICE_ACCOUNT_CLIENT_EMAIL
      - GOOGLE_SERVICE_ACCOUNT_CLIENT_ID
      - RERANK_PROVIDER
      - RERANK_MODEL
      - JINA_API_KEY
      - VOYAGE_API_KEY
      - LLM_PROVIDER
      - LLM_BASE_URL
      - LLM_API_KEY
      - LLM_MODEL
      - FRONTEND_ORIGIN
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - /opt/vietlegal/credentials:/app/credentials:ro
    networks:
      - vietlegal_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    container_name: vietlegal-frontend
    build:
      context: ../..
      dockerfile: src/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - vietlegal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  vietlegal_net:
    external: true
    name: vietlegal_net

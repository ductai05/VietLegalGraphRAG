# =============================================================================
# VietLegalGraphRAG — DigitalOcean Production Stack
# =============================================================================
# This compose file starts:
#   1. backend (FastAPI API)
#   2. frontend (Gradio App for Contract OCR & Review)
#   3. graph_db (Neo4j Graph Database)
#
# Communication between backend and graph_db happens internally over the
# Docker bridge network (bolt://graph_db:7687) without TLS overhead, while
# database admin tools can connect externally via bolt+s (7687) / HTTPS (7473).
# =============================================================================

version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: src/backend/Dockerfile
    environment:
      - BACKEND_PORT
      - ELASTICSEARCH_URL
      - ELASTICSEARCH_API_KEY
      - ELASTICSEARCH_DENSE_INDEX
      - ELASTICSEARCH_SPARSE_INDEX
      # Internal connection to database service (no encryption overhead)
      - NEO4J_URI=bolt://graph_db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD
      - NEO4J_DATABASE=neo4j
      - GOOGLE_APPLICATION_CREDENTIALS
      - RERANK_PROVIDER
      - RERANK_MODEL
      - JINA_API_KEY
      - VOYAGE_API_KEY
      - LLM_PROVIDER
      - FRONTEND_ORIGIN
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./credentials:/app/credentials:ro
    depends_on:
      - graph_db
    restart: always

  frontend:
    build:
      context: ../..
      dockerfile: app/Dockerfile
    environment:
      - OCR_DETECTOR_MODEL
      - OCR_RECOGNIZER_MODEL
      - OCR_RECOGNITION_BACKEND
      - OCR_EASYOCR_LANGUAGES
      - OCR_RECOGNITION_BATCH_SIZE
      - OCR_CROP_PADDING_RATIO
      - OCR_ENGINE
      - OCR_DEVICE
      - OCR_TEXT_SCORE_THRESHOLD
      - PDF_DPI
      - MAX_PDF_DPI
      - MAX_PDF_PAGES
      - MAX_UPLOAD_MB
      - GEMINI_API_KEY
      - GEMINI_MODEL
      - GEMINI_CHUNK_CHARS
      - GEMINI_MAX_CHUNKS
      - GEMINI_MAX_OUTPUT_TOKENS
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - GRADIO_SHARE=false
      - GRADIO_QUEUE_SIZE
      - BACKEND_URL=http://backend:8000 # Internal link to backend api if needed
    ports:
      - "7860:7860"
    volumes:
      - ./credentials:/app/credentials:ro
    depends_on:
      - backend
    restart: always

  graph_db:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=1536m
      - NEO4J_server_memory_heap_max__size=1536m
      - NEO4J_server_memory_pagecache_size=1536m
      # Bolt TLS configured for secure external connections
      - NEO4J_server_bolt_enabled=true
      - NEO4J_server_bolt_tls__level=OPTIONAL
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_https_enabled=true
      - NEO4J_server_https_listen__address=0.0.0.0:7473
      - NEO4J_server_http_enabled=false
      - NEO4J_dbms_ssl_policy_bolt_enabled=true
      - NEO4J_dbms_ssl_policy_bolt_base__directory=/certificates/bolt
      - NEO4J_dbms_ssl_policy_bolt_private__key=private.key
      - NEO4J_dbms_ssl_policy_bolt_public__certificate=public.crt
      - NEO4J_dbms_ssl_policy_bolt_client__auth=NONE
      - NEO4J_dbms_ssl_policy_https_enabled=true
      - NEO4J_dbms_ssl_policy_https_base__directory=/certificates/https
      - NEO4J_dbms_ssl_policy_https_private__key=private.key
      - NEO4J_dbms_ssl_policy_https_public__certificate=public.crt
      - NEO4J_dbms_ssl_policy_https_client__auth=NONE
    ports:
      - "7687:7687"
      - "7473:7473"
    volumes:
      - neo4j_prod_data:/data
      - ./certs:/certificates
      - /tmp/neo4j_imports:/import
    restart: always

volumes:
  neo4j_prod_data:

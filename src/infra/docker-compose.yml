# =============================================================================
# VietLegalGraphRAG — Open WebUI Development Compose
# =============================================================================
#
# This compose file starts Open WebUI (integrating backend & frontend in one container)
# for local development. External resources (Elasticsearch Cloud, Neo4j VPS)
# are connected via env vars in src/infra/.env.
#
# Start:
#   docker compose --env-file src/infra/.env -f src/infra/docker-compose.yml up --build
#
# =============================================================================

services:
  open-webui:
    build:
      context: ../..
      dockerfile: src/infra/Dockerfile.openwebui
    environment:
      # Open WebUI admin auto-provisioning
      - WEBUI_ADMIN_EMAIL
      - WEBUI_ADMIN_PASSWORD
      - WEBUI_SECRET_KEY
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=pending
      # Open WebUI Direct LLM Connection (for plain chat)
      - OPENAI_API_BASE_URL=${LLM_BASE_URL}
      - OPENAI_API_KEY=${LLM_API_KEY}
      # Performance Tuning for Droplet VPS (Conserve RAM & CPU)
      - ENABLE_OLLAMA=false
      - RAG_EMBEDDING_ENGINE=
      - RAG_RERANKING_ENGINE=
      # RAG service credentials / config passed to Pipe Valves
      - BACKEND_PORT
      - ELASTICSEARCH_URL
      - ELASTICSEARCH_API_KEY
      - ELASTICSEARCH_INDEX
      - ELASTICSEARCH_ALIAS
      - EMBEDDING_PROVIDER
      - EMBEDDING_MODEL
      - EMBEDDING_DEVICE
      - EMBEDDING_CACHE_DIR
      - EMBEDDING_MAX_LENGTH
      - EMBEDDING_DIMS
      - EMBEDDING_ONNX_MODEL_PATH
      - EMBEDDING_ONNX_TOKENIZER_PATH
      - HF_HUB_DISABLE_SYMLINKS_WARNING
      - DENSE_NUM_CANDIDATES_FACTOR
      - DENSE_MIN_NUM_CANDIDATES
      - NEO4J_URI
      - NEO4J_USER
      - NEO4J_PASSWORD
      - NEO4J_DATABASE
      - GOOGLE_APPLICATION_CREDENTIALS
      - OCR_PROVIDER
      - OCR_MAX_FILE_MB
      - OCR_MAX_PDF_PAGES
      - OCR_ALLOWED_MIME_TYPES
      - OCR_LANGUAGE_HINTS
      - RERANK_PROVIDER
      - RERANK_MODEL
      - VOYAGE_API_KEY
      - JINA_API_KEY
      - LLM_PROVIDER
      - LLM_BASE_URL
      - LLM_API_KEY
      - LLM_MODEL
      - LLM_MAX_TOKENS
      - ELASTICSEARCH_VERIFY_CERTS
      - ELASTICSEARCH_REQUEST_TIMEOUT
      - RERANK_MODEL_ALLOWLIST
      - RUNTIME_FALLBACK_ENABLED
      - AGENT_ENABLED
      - AGENT_MAX_ITERATIONS
      - WEB_SEARCH_PROVIDER
      - WEB_SEARCH_DOMAINS
      - EXA_API_KEY
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      - webui-data:/app/backend/data
      - ./credentials:/app/credentials:ro
      - ./hf-cache:/app/.cache/huggingface
      - ../../onnx_model:/app/onnx_model:ro
      - ../../src/vietlegal_rag:/app/vietlegal_rag
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  webui-data:
